<section class="content app-view extra-view" id="batchEditView" hidden><div class="heading"><div><h1>批量剪辑</h1><p>从参考拆解到剪映草稿，按任务批量生成并逐项验收。</p></div><button class="btn primary" id="runBatch">开始处理队列</button></div><div class="workflow"><div class="flow-head"><h2>自动化流程</h2><p>每个阶段都有明确输入、产物与人工检查点</p></div><div class="flow-steps"><div><b>① 环境检查</b><small>Python · FFmpeg · 剪映</small></div><i>→</i><div><b>② 项目目录</b><small>素材 / 工作区 / 成品</small></div><i>→</i><div><b>③ 参考拆解</b><small>镜头 · 时长 · 文案</small></div><i>→</i><div><b>④ 素材匹配</b><small>关键帧 · 置信度</small></div><i>→</i><div><b>⑤ 配音字幕</b><small>TTS · SRT · 时长</small></div><i>→</i><div><b>⑥ 草稿验收</b><small>预览 · 剪映草稿</small></div></div></div><div class="view-grid"><article class="card view-card"><h2>批量任务</h2><div class="settings-form"><label>参考视频（支持多选）<input id="refFiles" type="file" accept="video/*" multiple></label><label>素材库（支持多选）<input id="assetFiles" type="file" accept="video/*,image/*" multiple></label><label>批量脚本 / 配音文案<textarea id="batchScript" rows="5" placeholder="每行一条任务主题，或每段一条配音"></textarea></label><div class="settings-counts"><label>输出比例<select id="aspect"><option value="9:16">9:16 竖屏</option><option value="16:9">16:9 横屏</option><option value="1:1">1:1 方形</option></select></label><label>每条时长（秒）<input id="duration" type="number" min="3" value="30"></label><label>并发数<input id="concurrency" type="number" min="1" max="8" value="2"></label></div><button class="btn" id="checkEnv">检查本机环境</button> <button class="btn" id="buildBatch">生成任务计划</button></div></article><article class="card view-card"><h2>环境与处理记录</h2><div id="envResults" class="view-muted">先运行环境检查。</div><div id="batchLog"></div></article></div><article class="card view-card" style="margin-top:16px"><h2>任务队列</h2><div id="batchQueue" class="view-muted">选择参考视频和素材后生成批量计划。</div></article></section>
